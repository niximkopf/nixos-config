[osd]
position = "top_right"
position_vertical = "top_right"

[plugins]
enabled = [ "dotnetrob/cat", "noctalia/kaomoji", "nightwatch75/todo", "noctalia/timer", "noctalia/screen_recorder" ]

[shell]
app_icon_color = "primary"
app_icon_colorize = true
avatar_path = "/home/micha/Pictures/PFP/emilia thuglife.jpeg"
font_family = "Monocraft"

    [shell.screen_corners]
    enabled = true
    size = 16

    [shell.screenshot]
    directory = "/home/micha/Pictures/screenshots"

[theme]
builtin = "Ayu"
community_palette = "Lilac AMOLED"
mode = "dark"
pure_black_dark = true
source = "community"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "btop", "cava", "gtk3", "gtk4", "qt" ]
    community_ids = [ "opencode", "brave-origin", "discord", "blender", "neovim", "steam", "fastfetch", "bat", "lazygit", "yazi" ]

[wallpaper]
directory = "/home/micha/Pictures/wallpaper"
directory_dark = "/home/micha/Pictures/wallpaper"

    [wallpaper.default]
    path = "/home/micha/Pictures/wallpaper/fav/train-sideview.png"

    [wallpaper.last]
    path = "/home/micha/Pictures/wallpaper/fav/wallhaven-5ypy88-violett.png"

    [wallpaper.monitors.DP-1]
    path = "/home/micha/Pictures/wallpaper/fav/wallhaven-5ypy88-violett.png"

    [wallpaper.monitors.DP-2]
    path = "/home/micha/Pictures/wallpaper/fav/wallhaven-p9yy39.png"

[widget.audio_visualizer]
capsule = true
capsule_fill = "primary"
capsule_opacity = 0.65000000000000002
capsule_padding = 0
capsule_radius = 6
color_1 = "on_primary"
color_2 = "on_primary"
show_when_idle = true
width = 128

[widget.bar]
type = "noctalia/timer:bar"

[widget.bluetooth]
hide_when_no_connected_device = true

[widget.cat]
capsule = true
capsule_border = "primary"
capsule_opacity = 0.75
capsule_radius = 6
cat_size = 28
run_threshold = 50
scale = 1.05
type = "dotnetrob/cat:cat"
