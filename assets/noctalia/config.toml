[accessibility]
ui_scale = 1.1500000096857548

[backdrop]
enabled = true

[bar]
order = [ "default" ]

    [bar.default]
    background_opacity = 0.64999998547136784
    border = "primary"
    capsule_thickness = 0.74999998696148396
    center = [ "audio_visualizer", "clock", "audio_visualizer" ]
    end = [ "tray", "group:g1", "recorder", "group:g2", "session" ]
    font_family = "Monocraft"
    margin_ends = 0
    position = "left"
    radius = 0
    radius_bottom_left = 0
    radius_top_left = 0
    scale = 1.1500000096857548
    start = [ "launcher", "workspaces", "cat" ]
    thickness = 48
    widget_spacing = 10

        [bar.default.monitor.DP-1]
        position = "right"

        [[bar.default.capsule_group]]
        accordion = false
        accordion_direction = "end"
        border = "primary"
        enabled = true
        fill = "surface_variant"
        id = "g1"
        members = [ "bar", "todo" ]
        opacity = 0.75
        padding = 6.0
        radius = 6.0

        [[bar.default.capsule_group]]
        accordion = false
        accordion_direction = "end"
        border = "primary"
        enabled = true
        fill = "surface_variant"
        id = "g2"
        members = [ "network", "bluetooth", "volume" ]
        opacity = 0.75
        padding = 6.0
        radius = 6.0

[control_center]
hidden_tabs = [ "monitor", "power", "network", "weather" ]
width = 900

    [[control_center.shortcuts]]
