[widget.clipboard]
enabled = false

[widget.clock]
anchor = true
capsule = true
capsule_border = "primary"
capsule_opacity = 0.75
capsule_radius = 6

[widget.control-center]
enabled = false

[widget.launcher]
capsule = true
capsule_border = "primary"
capsule_opacity = 0.75
capsule_radius = 6
custom_image = "/home/micha/.nixos/assets/icons/nixos-customized (1).svg"

[widget.media]
enabled = false

[widget.network]
show_label = false

[widget.notifications]
enabled = false

[widget.recorder]
